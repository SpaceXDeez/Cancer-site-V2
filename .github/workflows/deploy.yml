name: Deploy

on:
  push:
    branches:
      - main
      - feature-test-branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy → Production  (main branch)
        if: github.ref == 'refs/heads/main'
        run: railway up --detach --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy → Staging  (feature-test-branch)
        if: github.ref == 'refs/heads/feature-test-branch'
        run: railway up --detach --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
